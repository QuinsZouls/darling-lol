# packaging/rpm/rpmlint.toml -- the rpmlint configuration for the darling-lol rpms (PLAN 10, 10.3).
#
# POLICY, the same as the deb overrides of PLAN 9.6: `errors` fail the gate (G-RPM-4), `warnings`
# do not. A filter is therefore only ever written for an *error* this package can justify, and
# every one of them is scoped: rpmlint 2.x applies these regexes to the whole message line
# ("<pkg>.<arch>: E: <tag> <detail>"), so a filter that names the path or the value it exempts
# leaves everything else reported. A blanket rule would be a lie -- which is exactly the reason
# 9.6 gives for not writing `*` into the lintian overrides.
#
# Load it with `-c` (`--config`): see the FINDING in the T4 report -- rpmlint 2.x's `--file` is an
# alias of `-r/--rpmlintrc` (a Python-ish `addFilter("…")` file), NOT a TOML config, so PLAN 10.3's
# literal `rpmlint --file rpmlint.toml` cannot work on rpmlint 2.6.1; `-c` is the option that takes
# this file. `Filters` is a list of regexes, merged (appended) onto the Fedora defaults.
#
# Every entry below is load-bearing: `rpmlint` reports "N filtered, M unused" and the G-RPM-4 gate
# asserts the unused count is 0, so a filter that stops applying (e.g. because a %changelog was
# added back) turns the gate red instead of rotting here silently.
Filters = [
    # rpmlint presumes automatic dependency generation and treats an explicit "Requires: <lib>"
    # as a mistake. AutoReqProv is deliberately OFF here (PLAN 10.1, C11): the auto-scanner would
    # walk the guest tree and emit sonames that exist on no RPM distro. The explicit, reviewed list
    # in packaging/common/deps.rpm.fc41 is its replacement, so the check's premise does not hold
    # for any requirement of this package -- hence a tag-level filter rather than a path-scoped one.
    'explicit-lib-dependency',
    # The guest tree is macOS content: 142 of its *.so files are Mach-O, and the fixture stages
    # guest stubs that carry the ELF magic without being readable as ELF (usr/bin/write,
    # usr/lib/libguest.bin -- measured; the *host* stand-ins have no ELF magic at all, they are NUL
    # bytes plus strings). readelf cannot read either shape, exactly as it cannot read the same
    # files on the real payload. Scoped to the guest subtree on purpose: the filter names the tree it
    # exempts instead of the tag, so a host binary readelf cannot parse is still reported, and the
    # G-RPM-4 gate asserts this filter matches >=1 message (unused filters fail the gate).
    'readelf-failed /usr/libexec/darling/',
    # /usr/bin/darling is setuid root on purpose: the CLI starts the container as root and drops
    # privileges. Upstream overrides the same lintian tag (PLAN 9.6); rpm needs the bit in
    # metadata (%attr(4755,root,root)) and this is the check that notices it exists.
    'setuid-binary /usr/bin/darling',
    # The guest's usr/bin/write is 2755 setgid in the payload and must stay that way (PLAN 13.1:
    # nothing in the chain normalises modes inside libexec/darling).
    'setgid-binary /usr/libexec/darling/usr/bin/write',
    # The two modes above are "non-standard" only against rpmlint's default of 0755/0644; both are
    # the deliberate values, named here per path so any *other* odd mode is still an error.
    'non-standard-executable-perm /usr/bin/darling 4755',
    'non-standard-executable-perm /usr/libexec/darling/usr/bin/write 2755',
    # There is deliberately no %changelog (PLAN 10.1): rpmbuild does not require one, and this
    # project ships /usr/share/doc/darling-lol/BUILD-INFO.txt instead, with commit, inputs and
    # provenance. Add a %changelog and this filter becomes unused -- which the gate reports.
    'no-changelogname-tag',
    # Technical terms the Fedora dictionary lacks: "setuid"/"setgid" (POSIX modes) and
    # "darlingserver"/"darling-coredump" (this project's own binary names) in the descriptions.
    # Same technique and same list as /etc/xdg/rpmlint/fedora.toml:302, which is additive here.
    "spelling-error.* (setuid|setgid|darlingserver|coredump|darling|mldr|Mach-O|noarch)",
]